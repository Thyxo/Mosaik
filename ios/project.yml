# XcodeGen-projekt (der committes ingen .xcodeproj): `xcodegen` i ios/ laver Mosaik.xcodeproj.
name: Mosaik
options:
  bundleIdPrefix: dk.thyxo
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Mosaik:
    type: application
    platform: iOS
    sources:
      - path: Mosaik
        excludes:
          - "Resources/Pool/**"
      - path: Mosaik/Resources/Pool
        type: folder
        buildPhase: resources
    info:
      path: Mosaik/Info.plist
      properties:
        CFBundleDisplayName: Fotos
        CFBundleName: Fotos
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: da
        LSRequiresIPhoneOS: true
        NSPhotoLibraryUsageDescription: Fotos viser billederne i dit bibliotek.
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.thyxo.mosaik
        PRODUCT_NAME: Mosaik
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: NO
        SWIFT_STRICT_CONCURRENCY: minimal
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Manual
